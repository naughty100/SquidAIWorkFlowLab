[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squid-ai-workflow-lab"
version = "0.1.0"
description = "用于学习、验证和复盘 AI 工作流能力的本地实验项目"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2.0,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
]

[project.scripts]
lab = "ai_workflow_lab.cli:app"

[dependency-groups]
dev = [
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_workflow_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "live: tests that make external network requests and may incur cost",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]
ignore = ["RUF001", "RUF002"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
